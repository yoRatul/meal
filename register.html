<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<header id="header">
    <h2>Register your profile</h2>
</header>
<body id="body">
    <form action="" method="get">
        <div style="margin-bottom: 10px;">
            <label for="name">Full name</label>
            <input type="text" class="regiInfo" id="name">
        </div>
        <div style="margin-bottom: 10px;">
            <label for="username">set a username</label>
            <input type="text" class="regiInfo" id="username">
        </div> 
        <div style="margin-bottom: 10px;">
            <label for="password">set a password</label>
            <input type="password" class="regiInfo" id="password">
        </div>
        <div style="margin-bottom: 10px;">
            <label for="passwordValidation">ensure password</label>
            <input type="password" class="regiInfo" id="passwordValidation">
        </div>
        <div style="margin-bottom: 10px;">
            <label for="joinDate">date of joining</label>
            <input type="date" class="regiInfo" id="joinDate"> 
        </div>
        <div>
            <button type="submit" id="registerButton">register</button>
        </div>
    </form>
</body>
</html>
